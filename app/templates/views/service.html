{% load static %}
<div class="modal-header border-0">
    <h4 class="modal-title" id="portfolio-title">{{service.name}}</h4>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="w-75 p-3" style="margin: auto;">
        {% if service.servicephoto_set.first.info == 'Image' %}
	    <img class="img-fluid" src="{{service.servicephoto_set.first.path.url}}" />
	    {% elif service.servicephoto_set.last.info == 'Image' %}
	    <img class="img-fluid" src="{{service.servicephoto_set.last.path.url}}" />
	    {% endif %}
        <hr />
        {{service.description|safe}}
    </div>
</div>
