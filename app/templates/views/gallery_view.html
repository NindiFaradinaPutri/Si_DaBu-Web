{% load static %}
{% load custom_tags %}
<div class="modal-header border-0">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body" style="margin: auto;">
    {% if gallery.foto %}
	<img src="/media/{{gallery.foto}}" class="img-fluid border-radius-0" style="width: 100%; height: auto;" alt="">
	{% elif gallery.link %}
    <div class="video-background">
		{{ gallery.link|video_link }}
    </div>
	{% elif gallery.video %}
    <div class="video-background">
	    <video controls preload="none" autoplay>
            <source src="/media/{{gallery.video}}" type="video/mp4">
        </video>
    </div>
	{% endif %}
    <h4 class="modal-title text-center">{{gallery.informasi}}</h4>
</div>

{% block theme %}
<style>
.video-background {
  position: relative;
  overflow: hidden;
  width: 80vw;
  height: 70vh;
}

.video-background iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 80vw;
  height: 70vh;
  transform: translate(-50%, -50%);
}

.video-background video {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 80vw;
  height: 70vh;
  transform: translate(-50%, -50%);
}
</style>
{% endblock %}
