<div class="modal fade" id="formKeuanganModals" tabindex="-1" role="dialog" 
	 aria-labelledby="formKeuanganTitle" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-xl" role="form">
        <form method="POST" enctype="multipart/form-data" id="id_form">
        {% csrf_token %}
        <div class="modal-content">
            <div class="modal-header bg-green">
                <h5 class="modal-title" id="modal-title">Masukan Pass Code</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <section class="row p-2 m-2">
                <div class="col-lg-12 col-md-12 col-12">
                    <input type="hidden" name="selected_id" id="selected_id" />
                    <div class="m-0 p-0" id="form_area">
                        <input type="password" name="pass_code" id="id_pass_code_keuangan" />
                    </div>                    
                </div>
            </section>
            
            <div class="modal-footer justify-content-center">
                <button class="btn btn-success btn-sm modal-confirm" type="submit" name="submit" id="id_keuangan_modal">Simpan</button>
                <a class="btn btn-default btn-sm" role="button" id="btn_close" data-dismiss="modal">Tutup</a>
            </div>
        </div>
        </form>
    </div>
</div>
