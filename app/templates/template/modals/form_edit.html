<div class="modal fade" id="formEditModals" tabindex="-1" role="dialog" 
	 aria-labelledby="formEditTitle" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered model-lg" role="form" style="max-width:800px;">
        <div class="modal-content">
            <div class="modal-header bg-green">
                <h5 class="modal-title" id="modal-title">Edit Data Pasien</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form method="POST" enctype="multipart/form-data" id="id_form">
                {% csrf_token %}
                <section class="row p-2 m-2">
                    <div class="col-lg-12 col-md-12 col-12">
                        <input type="hidden" name="selected_id" id="selected_id" />
                        <div class="m-0 p-0" id="form_area">
                            {% include 'template/tmp_formrow.html' with form=selected_form %}
                        </div>
                    </div>
                </section>
            </form>
            <div class="modal-footer justify-content-center">
                <button class="btn btn-success btn-sm modal-confirm" type="submit" name="submit" id="submit">Simpan</button>
                <a class="btn btn-default btn-sm" role="button" id="btn_submit" data-dismiss="modal">Tutup</a>
            </div>
        </div>
    </div>
</div>
