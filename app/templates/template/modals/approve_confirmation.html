<div class="modal fade" id="approveConfirmationModals" tabindex="-1" role="dialog" 
	 aria-labelledby="approveConfirmationTitle" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header bg-green">
                <h5 class="modal-title" id="modal-title">Konfirmasi Persetujuan</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <form class="form-horizontal" method="POST" id="approve_form">
                {% csrf_token %}
                <div class="modal-body">
                    <p id="id_question">
                    Anda menyetujui {{info_data}} <strong id="approve_item"></strong>?
                    </p>
                    <input type="hidden" name="key" id="key_id" />
                    <input type="hidden" name="action" id="action" />
                </div>
                <div class="modal-footer justify-content-center">
                    <button class="btn btn-success btn-sm modal-confirm" type="submit" id="btn_approve">Setujui</button>
                    <a class="btn btn-default btn-sm" role="button" data-dismiss="modal">Tutup</a>
                </div>
            </form>
        </div>
    </div>
</div>
