<div class="modal fade" id="responseConfirmationModals" tabindex="-1" role="dialog" 
	 aria-labelledby="responseConfirmationTitle" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">Tanggapan Terhadap Permohonan</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="alert alert-success" id="id_message">
            </div>
            <form class="form-horizontal" enctype="multipart/form-data" method="POST">
                {% csrf_token %}
                <div class="modal-body">
                    {% include 'template/tmp_form.html' with form=verificationForm %}
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="submit" class="submit btn btn-warning btn-sm">Kirim</button>
                    <a class="btn btn-default btn-sm" role="button" data-dismiss="modal">Tutup</a>
                </div>
            </form>
        </div>
    </div>
</div>
