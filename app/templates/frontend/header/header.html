{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silatama Event</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        body{
            font-family:'Inter',sans-serif;
            background:#f8f9fb;
            color:#191c1e;
        }

        :root{
            --primary:#ba0013;
            --primary-light:#e31e24;
            --secondary:#5e5e5e;
        }

        /* NAVBAR */
        .navbar-custom{
            background:#fff;
            border-bottom:1px solid #eee;
            height:70px;
            position:sticky;
            top:0;
            z-index:999;
        }

        .logo-img{
            height:32px;
            width:auto;
        }

        .logo-text{
            font-size:22px;
            font-weight:800;
            color:#dc3545;
            margin-left:10px;
        }

        /* HERO */
        .hero-section{
            padding:80px 0;
            position:relative;
            overflow:hidden;
        }

        .hero-badge{
            background:#e31e24;
            color:white;
            padding:8px 16px;
            border-radius:8px;
            font-size:13px;
            font-weight:600;
            display:inline-block;
            margin-bottom:20px;
        }

        .hero-title{
            font-size:48px;
            font-weight:700;
            line-height:1.2;
            margin-bottom:20px;
        }

        .hero-subtitle{
            color:#5e5e5e;
            font-size:18px;
            max-width:500px;
        }

        .hero-image-wrapper{
            position:relative;
        }

        .hero-image{
            width:100%;
            height:420px;
            object-fit:cover;
            border-radius:20px;
            box-shadow:0 20px 40px rgba(0,0,0,0.1);
        }

        /* Floating card seperti tailwind */
        .floating-card{
            position:absolute;
            bottom:-30px;
            left:-30px;
            background:white;
            width:240px;
            padding:20px;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
        }

        .progress{
            height:6px;
        }

        /* background blur kanan */
        .hero-blur{
            position:absolute;
            right:0;
            top:0;
            width:35%;
            height:100%;
            background:#edeef0;
            filter:blur(80px);
            opacity:0.5;
            z-index:-1;
        }

        .btn-red{
            background:var(--primary);
            color:white;
        }

        .btn-red:hover{
            background:#92000d;
            color:white;
        }

        @media(max-width:992px){
            .floating-card{
                position:relative;
                left:0;
                bottom:0;
                margin-top:20px;
                width:100%;
            }

            .hero-title{
                font-size:34px;
            }
        }
    </style>
</head>
<body>
