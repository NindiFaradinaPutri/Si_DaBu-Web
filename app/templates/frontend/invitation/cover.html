{% load static %}
<!-- COVER -->
<section id="cover"
         class="hero-section page-section position-relative overflow-hidden">
    <div class="cover-blur-bg"></div>
    <!-- Poster Background -->
    <div class="cover-poster-wrapper">

        <img src="{% static 'media/poster/default_poster.jpeg' %}"
             alt="Event Poster"
             class="cover-poster-img">

    </div>

    <!-- Overlay -->
    <div class="cover-overlay"></div>

    <!-- Content -->
    <div class="cover-content">



        <!-- Read More Button -->
        <a href="#home"
           class="btn-cover-readmore">

            <span class="material-symbols-outlined">
                keyboard_arrow_down
            </span>

            <span>
                Baca Selengkapnya
            </span>

        </a>

    </div>

</section>
