{% load static %}



<!-- Bottom Navigation -->
<nav class="fixed-bottom nav-bottom">
    <div class="container main-container">
        <div class="d-flex justify-content-around align-items-center py-2" style="height: 44px;">
            <a class="text-decoration-none d-flex flex-column align-items-center p-2 nav-item-active"
               href="#cover">

                <span class="material-symbols-outlined">
                    celebration
                </span>

                <span class="font-label"
                      style="font-size: 10px; margin-top: 4px;">
                    Cover
                </span>
            </a>

            <a class="text-decoration-none d-flex flex-column align-items-center p-2 text-on-surface-variant opacity-75"
               href="#home">

                <span class="material-symbols-outlined">
                    home_app_logo
                </span>

                <span class="font-label"
                      style="font-size: 10px; margin-top: 4px;">
                    Home
                </span>
            </a>

            <a class="text-decoration-none d-flex flex-column align-items-center p-2 text-on-surface-variant opacity-75"
               href="#details">

                <span class="material-symbols-outlined">
                    calendar_month
                </span>

                <span class="font-label"
                      style="font-size: 10px; margin-top: 4px;">
                    Details
                </span>
            </a>

            <a class="text-decoration-none d-flex flex-column align-items-center p-2 text-on-surface-variant opacity-75"
               href="#map">

                <span class="material-symbols-outlined">
                    location_on
                </span>

                <span class="font-label"
                      style="font-size: 10px; margin-top: 4px;">
                    Map
                </span>
            </a>

            <a class="text-decoration-none d-flex flex-column align-items-center p-2 text-on-surface-variant opacity-75"
               href="#rsvp">

                <span class="material-symbols-outlined">
                    how_to_reg
                </span>

                <span class="font-label"
                      style="font-size: 10px; margin-top: 4px;">
                    REG
                </span>
            </a>
        </div>
    </div>
</nav>



<script>

document.addEventListener('DOMContentLoaded', function () {

    const sections =
        document.querySelectorAll('section[id]');

    const navLinks =
        document.querySelectorAll('.nav-bottom a');

    function activateMenu() {

        let currentSection = '';

        sections.forEach(section => {

            const sectionTop =
                section.offsetTop - 120;

            const sectionHeight =
                section.offsetHeight;

            if (
                window.scrollY >= sectionTop &&
                window.scrollY < sectionTop + sectionHeight
            ) {

                currentSection =
                    section.getAttribute('id');
            }
        });

        navLinks.forEach(link => {

            link.classList.remove(
                'nav-item-active'
            );

            link.classList.add(
                'text-on-surface-variant',
                'opacity-75'
            );

            const href =
                link.getAttribute('href');

            if (href === '#' + currentSection) {

                link.classList.add(
                    'nav-item-active'
                );

                link.classList.remove(
                    'text-on-surface-variant',
                    'opacity-75'
                );
            }
        });
    }

    // klik navigation
    navLinks.forEach(link => {

        link.addEventListener(
            'click',
            function () {

                navLinks.forEach(item => {

                    item.classList.remove(
                        'nav-item-active'
                    );

                    item.classList.add(
                        'text-on-surface-variant',
                        'opacity-75'
                    );
                });

                this.classList.add(
                    'nav-item-active'
                );

                this.classList.remove(
                    'text-on-surface-variant',
                    'opacity-75'
                );
            }
        );
    });

    window.addEventListener(
        'scroll',
        activateMenu
    );

    activateMenu();

});

</script>
