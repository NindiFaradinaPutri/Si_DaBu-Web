{% load static %}
<!-- templates/backend/header/header_page.html -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<style>
.top-app-bar {
    height: 64px;
    position: fixed;
    top: 0; right: 0;
    background: white;
    border-bottom: 1px solid #dee2e6;
    z-index: 999;
    display: flex;
    align-items: center;
    padding: 0 2rem;
    justify-content: space-between;
}
.material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
}
</style>

<header class="top-app-bar">
    <div class="search-bar"></div>
    <div class="d-flex align-items-center gap-3">

        <!-- NOTIFICATION BELL -->
        <div class="position-relative" id="notif-wrapper">
            <button class="btn btn-link text-muted p-2 position-relative"
                    id="notif-btn" onclick="toggleNotifPanel()">
                <span class="material-symbols-outlined">notifications</span>
                <span id="notif-badge" class="position-absolute bg-danger text-white rounded-pill"
                      style="top:4px;right:0;font-size:10px;font-weight:700;min-width:18px;
                             height:18px;display:none;align-items:center;justify-content:center;
                             padding:0 4px;line-height:1;">0</span>
            </button>

            <div id="notif-panel" class="shadow-lg"
                 style="display:none;position:absolute;top:110%;right:0;width:340px;
                        background:white;border-radius:12px;border:1px solid #e9ecef;
                        z-index:9999;overflow:hidden;">
                <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                    <span class="fw-bold" style="font-size:14px;">Notifikasi</span>
                    <span id="notif-count-label" class="badge bg-danger rounded-pill"
                          style="font-size:11px;display:none;">0 baru</span>
                </div>
                <div id="notif-list" style="max-height:360px;overflow-y:auto;">
                    <div id="notif-loading" class="text-center py-4 text-muted" style="font-size:13px;">
                        <span class="material-symbols-outlined" style="font-size:20px;">autorenew</span>
                        <p class="mb-0 mt-1">Memuat...</p>
                    </div>
                    <div id="notif-empty" class="text-center py-4 text-muted"
                         style="display:none;font-size:13px;">
                        <span class="material-symbols-outlined" style="font-size:32px;color:#ccc;">notifications_off</span>
                        <p class="mb-0 mt-2">Tidak ada notifikasi baru</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="notif-overlay" onclick="closeNotifPanel()"
             style="display:none;position:fixed;inset:0;z-index:9998;"></div>

        <div class="vr mx-2" style="height:32px;"></div>

        <div class="d-flex align-items-center gap-2">
            <div class="text-end d-none d-md-block">
                <p class="mb-0 fw-bold small">Silatama Admin</p>
                <p class="mb-0 text-muted" style="font-size:12px;">Event Admin</p>
            </div>
            <img alt="Profile" class="rounded-circle border" height="40" width="40"
                 src="https://ui-avatars.com/api/?name=AD&background=E31E24&color=fff"/>
        </div>
    </div>
</header>

<script>
// ============================================================
// NOTIFICATION SYSTEM
// ============================================================

let notifOpen = false;
let notifLoaded = false;

// --- Toggle buka/tutup panel ---
function toggleNotifPanel() {
    if (notifOpen) {
        closeNotifPanel();
    } else {
        openNotifPanel();
    }
}

function openNotifPanel() {
    document.getElementById('notif-panel').style.display = 'block';
    document.getElementById('notif-overlay').style.display = 'block';
    notifOpen = true;

    // Load notif dari server tiap kali dibuka
    loadNotifications();
}

function closeNotifPanel() {
    document.getElementById('notif-panel').style.display = 'none';
    document.getElementById('notif-overlay').style.display = 'none';
    notifOpen = false;
}

// --- Ambil notifikasi via AJAX ---
function loadNotifications() {
    document.getElementById('notif-loading').style.display = 'block';
    document.getElementById('notif-empty').style.display   = 'none';

    // Hapus item lama (selain loading & empty)
    const list = document.getElementById('notif-list');
    list.querySelectorAll('.notif-item').forEach(el => el.remove());

    fetch("{% url 'get_notifications' %}", {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('notif-loading').style.display = 'none';
        renderNotifications(data.notifications);
        updateBadge(data.unread_count);
    })
    .catch(() => {
        document.getElementById('notif-loading').style.display = 'none';
        document.getElementById('notif-empty').style.display   = 'block';
    });
}

// --- Render card notifikasi ---
function renderNotifications(notifications) {
    const list  = document.getElementById('notif-list');
    const empty = document.getElementById('notif-empty');

    if (notifications.length === 0) {
        empty.style.display = 'block';
        return;
    }

    notifications.forEach(n => {
        const card = document.createElement('div');
        card.className = 'notif-item d-flex align-items-start gap-2 px-3 py-2 border-bottom';
        card.style.cssText = `
            cursor: pointer;
            background: ${n.is_read ? '#fff' : '#EFF6FF'};
            transition: background .2s;
        `;
        card.dataset.notifId  = n.id;
        card.dataset.eventId  = n.event_id;
        card.dataset.isRead   = n.is_read;

        card.innerHTML = `
            <div style="
                width:8px; height:8px; border-radius:50%;
                background: ${n.is_read ? 'transparent' : '#3B82F6'};
                margin-top:5px; flex-shrink:0;
            " id="dot-${n.id}"></div>
            <div style="flex:1; min-width:0;">
                <p class="mb-0 fw-semibold" style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    ${n.participant_name}
                </p>
                <p class="mb-0 text-muted" style="font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    mendaftar ke <strong>${n.event_name}</strong>
                </p>
                <p class="mb-0 text-muted" style="font-size:11px; margin-top:2px;">
                    ${n.updated_date}
                </p>
            </div>
            <span class="material-symbols-outlined text-muted" style="font-size:16px; flex-shrink:0; margin-top:2px;">
                chevron_right
            </span>
        `;

        // Klik card → mark read dulu, lalu redirect ke event
		card.addEventListener('click', function () {
			const notifId = this.dataset.notifId;
			const eventId = this.dataset.eventId;
			const isRead  = this.dataset.isRead === 'true';

			if (!isRead) {
				markAsRead(notifId, this, eventId);
			} else {
				// Sudah dibaca, langsung ke event
				window.location.href = `/event/list/${eventId}/`;
			}
		});

        list.appendChild(card);
    });
}

// --- Mark as read via AJAX, lalu redirect ---
function markAsRead(notifId, cardEl, eventId) {
    fetch(`/notifications/${notifId}/read/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'X-Requested-With': 'XMLHttpRequest',
        }
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            // Ubah card jadi putih, hapus dot biru
            cardEl.style.background   = '#fff';
            cardEl.dataset.isRead     = 'true';
            document.getElementById(`dot-${notifId}`).style.background = 'transparent';

            // Kurangi badge
            decreaseBadge();

            // Redirect ke event di tab yang sama
            window.location.href = `/event/list/${eventId}/`;
        }
    })
    .catch(() => {
        window.location.href = `/event/list/${eventId}/`;
    });
}

// --- Update badge angka di bell ---
function updateBadge(count) {
    const badge       = document.getElementById('notif-badge');
    const countLabel  = document.getElementById('notif-count-label');

    if (count > 0) {
        const label = count > 9 ? '9+' : String(count);
        badge.textContent       = label;
        badge.style.display     = 'flex';
        countLabel.textContent  = `${label} baru`;
        countLabel.style.display = 'inline-block';
    } else {
        badge.style.display     = 'none';
        countLabel.style.display = 'none';
    }
}

function decreaseBadge() {
    const badge = document.getElementById('notif-badge');
    let current = badge.textContent === '9+' ? 10 : parseInt(badge.textContent || '0');
    current = Math.max(0, current - 1);
    updateBadge(current);
}

// --- Polling: refresh count tiap 30 detik ---
function refreshNotifCount() {
    fetch("{% url 'get_notifications' %}", {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(res => res.json())
    .then(data => updateBadge(data.unread_count))
    .catch(() => {});
}

// --- Helper: ambil CSRF token ---
function getCookie(name) {
    let value = null;
    document.cookie.split(';').forEach(c => {
        c = c.trim();
        if (c.startsWith(name + '=')) value = decodeURIComponent(c.slice(name.length + 1));
    });
    return value;
}

// --- Init ---
document.addEventListener('DOMContentLoaded', function () {
    refreshNotifCount();                    // load badge saat halaman buka
    setInterval(refreshNotifCount, 30000);  // polling tiap 30 detik
});
</script>
