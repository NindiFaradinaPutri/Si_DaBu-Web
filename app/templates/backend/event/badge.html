{% load static %}
{% load widget_tweaks %}

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }

        /* ═══════════════════
           BADGE CONTAINER
        ═══════════════════ */
        .badge-wrapper {
            width: 320px;
            height: 520px;
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.30),
                0 6px 18px rgba(0,0,0,0.12);
            background-image: url('/static/media/background/bg_badge.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center top;
        }
        {% comment %} .badge-wrapper-2 {
            width: 320px;
            height: 520px;
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.30),
                0 6px 18px rgba(0,0,0,0.12);
            background-image: url('/static/media/background/badge_bg.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center top;
        } {% endcomment %}

        /* ═══════════════════════════════════════
           EVENT NAME
           — top: 95px → tepat di bawah logo
             PresenGO yang ada di background PNG
             (naikkan/turunkan nilai ini jika perlu)
        ═══════════════════════════════════════ */
        .badge-event {
            position: absolute;
            top: 95px;
            left: 18px;
            right: 18px;
            text-align: center;
        }

        .badge-event-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 12.5px;
            color: #1c1c1c;
            line-height: 1.4;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            padding:10px;
        }

        /* ═══════════════════
           DIVIDER
        ═══════════════════ */
        .badge-divider {
            position: absolute;
            top: 148px;
            left: 24px;
            right: 24px;
            height: 1.5px;
            background: linear-gradient(
                90deg,
                transparent 0%,
                #c0392b 20%,
                #e74c3c 50%,
                #c0392b 80%,
                transparent 100%
            );
        }

        /* ═══════════════════
           QR CODE
        ═══════════════════ */
        .badge-qr-wrap {
            position: absolute;
            top: 162px;
            left: 50%;
            transform: translateX(-50%);
        }

        .badge-qr-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px;
            box-shadow:
                0 6px 24px rgba(0,0,0,0.15),
                0 2px 6px rgba(0,0,0,0.08);
            display: inline-flex;
        }

        .badge-qr-card img {
            width: 135px;
            height: 135px;
            display: block;
            border-radius: 5px;
        }

        /* ═══════════════════
           NAMA
        ═══════════════════ */
        .badge-name-wrap {
            position: absolute;
            top: 325px;
            left: 16px;
            right: 16px;
            text-align: center;
        }

        .badge-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: #1a1a1a;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-shadow: 0 2px 6px rgba(255,255,255,0.8);
        }

        /* ═══════════════════
           INSTANSI
        ═══════════════════ */
        .badge-instansi-wrap {
            position: absolute;
            top: 366px;
            left: 16px;
            right: 16px;
            text-align: center;
        }

        .badge-instansi {
            display: inline-block;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 12px;
            color: #333;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.45);
            padding: 3px 16px;
            border-radius: 30px;
        }

        /* ═══════════════════
           EMAIL
        ═══════════════════ */
        .badge-email-wrap {
            position: absolute;
            top: 400px;
            left: 16px;
            right: 16px;
            text-align: center;
        }

        .badge-email {
            font-family: 'Poppins', sans-serif;
            font-size: 10px;
            color: #555;
        }

        /* ════════════════════════════════════════
           FOOTER BOTTOM
           — gradient tipis, hanya ~90px dari bawah
             agar tidak "makan" area tengah badge
        ════════════════════════════════════════ */
        .badge-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            /* tipis: mulai transparan, jadi solid hanya di ujung bawah */
            background: linear-gradient(
                to bottom,
                transparent            0%,
                rgba(90, 0, 0, 0.45)  40%,
                rgba(70, 0, 0, 0.82)  75%,
                rgba(55, 0, 0, 0.94) 100%
            );
            /* kurangi padding atas agar area merah tidak terlalu tinggi */
            padding: 18px 18px 14px;
            text-align: center;
        }

        .badge-location {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.65);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* dot merah kecil pengganti emoji */
        .badge-location::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #ff6b6b;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .badge-uid-pill {
            display: inline-block;
            background: rgba(0,0,0,0.38);
            border: 1px solid rgb(255, 255, 255);
            border-radius: 20px;
            padding: 2px 12px;
        }

        .badge-uid {
            font-family: 'Poppins', sans-serif;
            font-size: 8.5px;
            color: rgb(255, 255, 255);
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        /* ═══════════════════
           PRINT
        ═══════════════════ */
        @media print {
            body {
                background: white;
                padding: 0;
                display: block;
            }
            .badge-wrapper {
                box-shadow: none;
                border-radius: 0;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <div class="badge-wrapper">

        <!-- Nama Event -->
        <div class="badge-event">
            <div class="badge-event-name">{{ event.name }}</div>
        </div>

        <!-- Garis Merah -->
        <div class="badge-divider"></div>

        <!-- QR Code -->
        <div class="badge-qr-wrap">
            <div class="badge-qr-card">
                <img src="/static/media/{{ participant.qr_code }}" alt="QR Code">
            </div>
        </div>

        <!-- Nama Peserta -->
        <div class="badge-name-wrap">
            <div class="badge-name">{{ participant.name }}</div>
        </div>

        <!-- Instansi -->
        {% if instansi %}
        <div class="badge-instansi-wrap">
            <div class="badge-instansi">{{ instansi }}</div>
        </div>
        {% endif %}

        <!-- Email -->
        {% if participant.email %}
        <div class="badge-email-wrap">
            <div class="badge-email">{{ participant.email }}</div>
        </div>
        {% endif %}

        <!-- Footer -->
        <div class="badge-footer">
            <div class="badge-location">{{ event.location }}</div>
            <div class="badge-uid-pill">
                <span class="badge-uid">{{ participant.unique_user }}</span>
            </div>
        </div>

    </div>

    {% comment %} <div class="badge-wrapper-2"></div> {% endcomment %}


</body>
</html>
