{% load static %}
{% load widget_tweaks %}

<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <style media="print">
            a:link {
                text-decoration: none;
            }
            div {
                break-inside: avoid;
              }
            h6 {
                text-align: center;
            }
            .font-style {
                font-size: 12px;
            }
            .head-style {
                font-size: 15px;
                font-weight:bold;
            }
            .exam-style {
                font-size: 16px;
                font-weight:bold;
            }
        </style>
        <style media="screen">
            a:link {
                text-decoration: none;
            }
    
            h6 {
                text-align: center;
            }
            .font-style {
                font-size: 12px;
            }
            .head-style {
                font-size: 15px;
                font-weight:bold;
            }
            .exam-style {
                font-size: 16px;
                font-weight:bold;
            }
        </style>
    </head>
    <body style="padding:20px">
        <div class='row'>
            <div style="width:300px; height:500px; display: flex; flex-direction: column; position: relative; padding:30px 10px 0px 10px; background-image: url('/static/media/background/badge_bg.png');
                    background-size: contain;
                    background-repeat: no-repeat;
                    background-position: center;">
                <table style='width:100%; height:150px; padding:0px;'>
                    <tr>
                        <td class='head-style text-center 'style='padding-top: 20px; padding-bottom:10px; font-size:17px;'>{{event.name|upper}}</td>
                    </tr>
                    
                    <tr style='border-bottom: 2px solid black;'>
                    </tr>
                    <tr style="">
                        <td class='font-style text-center' style='text-align: center; padding-top: 20px;'>
                            <div style='width:100%; height: 100%;'>
                                <span style=''><img src="/static/media/{{participant.qr_code}}" width="150px" height="150px" style="object-fit: cover;"></span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class='font-style text-center' style='height:50px; font-weight:bold; font-size:30px;'>{{participant.name}}</td>
                    </tr>
                    {% if instansi %}
                    <tr>
                        <td class='font-style text-center'>{{instansi}}</td>
                    </tr>
                    {% endif %}
                    <tr>
                        <td class='font-style text-center' style='font-weight:bold; font-size:15px;'>{{participant.email}}</td>
                    </tr>
                    
                </table>
                <table style='position: absolute; bottom: 0; left:0; width:100%; padding:0px;'>
                    <tr style="margin-top: auto;">
                        <td class='head-style text-center' style='font-weight:bold; color: #616161;'>{{event.location}}</td>
                    </tr>
                    <tr>
                        <td class='font-style text-center' style='font-weight:bold; color: white;'>{{participant.unique_user}}</td>
                    </tr>
                <table>
            </div>
        </div>
        <script src="" async defer></script>
    </body>
</html>
